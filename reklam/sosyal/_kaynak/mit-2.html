<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{width:1080px;height:1350px}

  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Geist',system-ui,sans-serif;background:#FCFAF8;color:#1C0F09;
    -webkit-font-smoothing:antialiased;position:relative;overflow:hidden;
    print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .glow{position:absolute;width:900px;height:900px;right:-320px;top:-380px;border-radius:50%;
    background:radial-gradient(circle,rgba(243,109,50,.16) 0%,rgba(243,109,50,.05) 46%,transparent 72%)}
  .glow2{position:absolute;width:760px;height:760px;left:-300px;bottom:-340px;border-radius:50%;
    background:radial-gradient(circle,rgba(182,51,37,.10) 0%,transparent 66%)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:14px;
    background:linear-gradient(180deg,#F36D32,#B63325)}
  .frame{position:relative;height:100%;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:24px;border-bottom:2px solid rgba(28,15,9,.12)}
  .wm{display:inline-flex;align-items:center;font-family:'Sora';font-weight:700;font-size:38px;
    letter-spacing:-.03em;line-height:1;white-space:nowrap}
  .wm .ink{color:#1C0F09}.wm .up{color:#E04E24}
  .pill{font-family:'Sora';font-weight:700;font-size:15px;letter-spacing:.19em;color:#B63325;
    border:2px solid rgba(224,78,36,.35);border-radius:999px;padding:10px 20px}
  .eyebrow{font-family:'Sora';font-weight:700;font-size:19px;letter-spacing:.20em;color:#8A7469;
    text-transform:uppercase}
  .hl{background:linear-gradient(100deg,#F36D32 0%,#B63325 82%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:32px;
    padding-top:24px;border-top:2px solid rgba(28,15,9,.12)}
  .foot .l{font-family:'Sora';font-weight:700;font-size:24px;letter-spacing:-.02em;color:#1C0F09}
  .foot .r{font-size:18px;color:#8A7469;font-weight:500}
  .kanit{font-family:'Geist Mono',monospace;font-size:16px;letter-spacing:.06em;color:#8A7469}
  .kanit b{color:#B63325;font-weight:600}

  h1{font-family:'Sora';font-weight:800;font-size:88px;line-height:1.04;letter-spacing:-.045em}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0}
  .sub{font-size:29px;line-height:1.5;color:#6B564B}
  .dev{font-family:'Sora';font-weight:800;font-size:230px;line-height:.9;letter-spacing:-.05em}
  .devlabel{font-family:'Sora';font-weight:700;font-size:36px;line-height:1.25;letter-spacing:-.02em;color:#1C0F09}
  .next{position:absolute;right:64px;bottom:120px;width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,#F36D32,#B63325);display:flex;align-items:center;justify-content:center}

  .frame{padding:72px 72px 64px 86px}
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div><div class="rail"></div>
  <div class="frame">

    <div class="top"><span class="wm"><span class="ink">Ranks</span><svg width="23" height="23" viewBox="0 0 40 40" fill="none" style="margin:0 -1px 0 2px"><path d="M10 30 L30 10" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round"/><path d="M17 8.5 L31.5 8.5 L31.5 23" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="up">Up</span></span><span class="pill">BULGU 01</span></div>
    <div class="mid" style="gap:26px">
      <div class="eyebrow">Google'da ilk 3 sonuç</div>
      <div class="dev hl">%5,3</div>
      <p class="devlabel">İlk 3'teki sayfaların %5,3'ü<br>%100 AI ile yazılmış.</p>
      <p class="sub">Tamamen AI ile üretilmiş sayfalar ilk 3'e girebiliyor.
      "AI yazdıysa Google gömer" iddiası, ilk sayfanın kendisiyle çelişiyor.</p>
      <p class="kanit">KAYNAK: AHREFS N=<b>80.861</b> · GOOGLE SEARCH CENTRAL (RESMİ)</p>
    </div>
    <div class="next"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="foot"><span class="l">ranksup.ai</span><span class="r">2 / 5</span></div>
  </div>
</body></html>
