<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:1200px;overflow:hidden}
  body{
    font-family:'Geist',system-ui,sans-serif;
    background:#171310;
    color:#F6F3EC;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(246,243,236,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(246,243,236,.05) 1px,transparent 1px);
    background-size:48px 48px}

  .frame{position:relative;height:100%;padding:84px;display:flex;flex-direction:column}

  /* sağ yarı: büyük basamak kompozisyonu */
  .steps-hero{position:absolute;right:84px;top:168px}

  .pill{align-self:flex-start;font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
    font-weight:500;font-size:21px;letter-spacing:.14em;text-transform:uppercase;
    color:#171310;background:#E04E24;border-radius:999px;padding:14px 28px}

  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px}
  h1{font-family:'Sora',sans-serif;font-weight:800;font-size:104px;line-height:1.0;
    letter-spacing:-.04em;color:#F6F3EC;word-break:break-word}
  .lede{margin-top:40px;font-size:27px;line-height:1.5;color:#A99F92;font-weight:400}
  .lede b{font-family:'Sora',sans-serif;font-weight:700;color:#F1652F}

  .rule{height:1px;background:rgba(246,243,236,.13);margin-bottom:36px}
  .foot{display:flex;align-items:center;justify-content:space-between}
  .wm{display:inline-flex;align-items:center;font-family:'Sora',sans-serif;font-weight:700;
    font-size:44px;letter-spacing:-.03em;line-height:1;white-space:nowrap}
  .wm .l{color:#F6F3EC}
  .wm .up{color:#E04E24}
  .wm svg{margin:0 -1px 0 2px}
  .url{font-family:'Sora',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.01em;
    color:#F6F3EC;border:1px solid rgba(246,243,236,.14);border-radius:999px;padding:11px 24px}
</style></head>
<body>
  <div class="grid"></div>

  <div class="frame">
    <!-- büyük basamak: 5 kare, sağ-üste tırmanış, son kare turuncu (ok ucu) -->
    <svg class="steps-hero" width="440" height="440" viewBox="0 0 440 440" fill="none">
      <rect x="0"   y="352" width="88" height="88" fill="#F6F3EC" opacity=".08"/>
      <rect x="88"  y="264" width="88" height="88" fill="#F6F3EC" opacity=".12"/>
      <rect x="176" y="176" width="88" height="88" fill="#F6F3EC" opacity=".17"/>
      <rect x="264" y="88"  width="88" height="88" fill="#F6F3EC" opacity=".24"/>
      <rect x="352" y="0"   width="88" height="88" fill="#E04E24"/>
    </svg>

    <span class="pill">AI Sektör Endeksi</span>

    <div class="mid">
      <h1>{{SEKTÖR}}</h1>
      <p class="lede"><b>{{X}}</b> gerçek Türkçe kullanıcı promptu test ettik.<br>7 AI motoru, tek tablo.</p>
    </div>

    <div class="rule"></div>
    <div class="foot">
      <span class="wm"><span class="l">Ranks</span><svg width="26" height="26" viewBox="0 0 40 40" fill="none"><path d="M10 30 L30 10" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round"/><path d="M17 8.5 L31.5 8.5 L31.5 23" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="up">Up</span></span>
      <span class="url">ranksup.ai</span>
    </div>
  </div>
</body></html>
