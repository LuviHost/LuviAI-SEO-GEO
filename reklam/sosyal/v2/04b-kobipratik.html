<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:1200px;overflow:hidden}
  body{
    font-family:'Geist',system-ui,sans-serif;
    background:#171310;
    color:#F6F3EC;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(246,243,236,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(246,243,236,.05) 1px,transparent 1px);
    background-size:48px 48px}

  .frame{position:relative;height:100%;padding:84px;display:flex;flex-direction:column}
  .steps{position:absolute;top:84px;right:84px}

  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .lockup{display:flex;align-items:center;gap:36px;white-space:nowrap}
  .wm{display:inline-flex;align-items:center;font-family:'Sora',sans-serif;font-weight:700;
    font-size:64px;letter-spacing:-.03em;line-height:1}
  .wm .l{color:#F6F3EC}
  .wm .up{color:#E04E24}
  .wm svg{margin:0 -1px 0 3px}
  .x{font-family:'Sora',sans-serif;font-weight:600;font-size:44px;color:#A99F92}
  .partner{font-family:'Sora',sans-serif;font-weight:700;font-size:64px;letter-spacing:-.03em;
    line-height:1;color:#F6F3EC}
  .mono-line{margin-top:52px;font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
    font-weight:500;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#A99F92}

  .foot{display:flex;align-items:center;justify-content:center}
  .url{font-family:'Sora',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.01em;
    color:#F6F3EC;border:1px solid rgba(246,243,236,.14);border-radius:999px;padding:11px 24px}
</style></head>
<body>
  <div class="grid"></div>

  <div class="frame">
    <svg class="steps" width="168" height="168" viewBox="0 0 168 168" fill="none">
      <rect x="0"   y="126" width="42" height="42" fill="#F6F3EC" opacity=".10"/>
      <rect x="42"  y="84"  width="42" height="42" fill="#F6F3EC" opacity=".16"/>
      <rect x="84"  y="42"  width="42" height="42" fill="#F6F3EC" opacity=".24"/>
      <rect x="126" y="0"   width="42" height="42" fill="#E04E24"/>
    </svg>

    <div class="mid">
      <div class="lockup">
        <span class="wm"><span class="l">Ranks</span><svg width="38" height="38" viewBox="0 0 40 40" fill="none"><path d="M10 30 L30 10" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round"/><path d="M17 8.5 L31.5 8.5 L31.5 23" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="up">Up</span></span>
        <span class="x">×</span>
        <span class="partner">Kobipratik</span>
      </div>
      <div class="mono-line">7 AI Motoru · Ortak Ölçüm</div>
    </div>

    <div class="foot">
      <span class="url">ranksup.ai</span>
    </div>
  </div>
</body></html>
