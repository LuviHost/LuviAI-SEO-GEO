<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:1200px;overflow:hidden}
  body{
    font-family:'Geist',system-ui,sans-serif;
    background:#F6F3EC;
    color:#171310;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  .frame{position:relative;height:100%;padding:84px;display:flex;flex-direction:column}
  .steps{position:absolute;top:84px;right:84px}

  .eyebrow{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
    font-weight:500;font-size:20px;letter-spacing:.14em;text-transform:uppercase;
    color:#6E6259;display:flex;align-items:center;gap:16px}
  .eyebrow::before{content:'';width:14px;height:14px;background:#E04E24;flex:none}

  h1{margin-top:36px;font-family:'Sora',sans-serif;font-weight:800;font-size:66px;line-height:1.06;
    letter-spacing:-.035em;color:#171310;max-width:980px}

  /* DataBar dili */
  .chart{flex:1;display:flex;flex-direction:column;justify-content:center;gap:52px}
  .row-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .lbl{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;font-weight:500;
    font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#171310}
  .val{font-family:'Sora',sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;
    color:#171310;font-variant-numeric:tabular-nums}
  .row.pri .val{color:#E04E24}
  .track{height:18px;width:100%;background:rgba(23,19,16,.08);border-radius:4px;overflow:hidden}
  .fill{height:100%;border-radius:4px}
  .row.pri .fill{background:#E04E24}
  .row.tas .fill{background:#8A8177}
  .row.tas2 .fill{background:#C9BFB2}

  .rule{height:1px;background:rgba(23,19,16,.11);margin-bottom:36px}
  .foot{display:flex;align-items:center;justify-content:space-between}
  .wm{display:inline-flex;align-items:center;font-family:'Sora',sans-serif;font-weight:700;
    font-size:44px;letter-spacing:-.03em;line-height:1;white-space:nowrap}
  .wm .l{color:#171310}
  .wm .up{color:#E04E24}
  .wm svg{margin:0 -1px 0 2px}
  .url{font-family:'Sora',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.01em;
    color:#171310;border:1px solid rgba(23,19,16,.12);border-radius:999px;padding:11px 24px;background:#FCFAF6}
</style></head>
<body>
  <div class="frame">
    <svg class="steps" width="168" height="168" viewBox="0 0 168 168" fill="none">
      <rect x="0"   y="126" width="42" height="42" fill="#171310" opacity=".05"/>
      <rect x="42"  y="84"  width="42" height="42" fill="#171310" opacity=".08"/>
      <rect x="84"  y="42"  width="42" height="42" fill="#171310" opacity=".12"/>
      <rect x="126" y="0"   width="42" height="42" fill="#E04E24"/>
    </svg>

    <div class="eyebrow">Bulgu 02 · {{KAYNAK}}</div>
    <h1>{{BAŞLIK — örn: "En iyi X" sorusunda kim anılıyor?}}</h1>

    <!-- Her satır: width:% değeri {{DEĞER}} ile orantılı elle güncellenir. -->
    <div class="chart">
      <div class="row pri">
        <div class="row-h"><span class="lbl">{{MARKA_1}}</span><span class="val">{{DEĞER_1}}</span></div>
        <div class="track"><div class="fill" style="width:82%"></div></div>
      </div>
      <div class="row tas">
        <div class="row-h"><span class="lbl">{{MARKA_2}}</span><span class="val">{{DEĞER_2}}</span></div>
        <div class="track"><div class="fill" style="width:57%"></div></div>
      </div>
      <div class="row tas">
        <div class="row-h"><span class="lbl">{{MARKA_3}}</span><span class="val">{{DEĞER_3}}</span></div>
        <div class="track"><div class="fill" style="width:41%"></div></div>
      </div>
      <div class="row tas2">
        <div class="row-h"><span class="lbl">{{MARKA_4}}</span><span class="val">{{DEĞER_4}}</span></div>
        <div class="track"><div class="fill" style="width:24%"></div></div>
      </div>
    </div>

    <div class="rule"></div>
    <div class="foot">
      <span class="wm"><span class="l">Ranks</span><svg width="26" height="26" viewBox="0 0 40 40" fill="none"><path d="M10 30 L30 10" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round"/><path d="M17 8.5 L31.5 8.5 L31.5 23" stroke="#E04E24" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="up">Up</span></span>
      <span class="url">ranksup.ai</span>
    </div>
  </div>
</body></html>
